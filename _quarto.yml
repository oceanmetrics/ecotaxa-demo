project:
  type: website
  output-dir: _site
  resources:
    - libs/svg-pan-zoom.min.js
    - libs/diagram.js
  render:
    - index.qmd
    - 01_export_ecotaxa.qmd
    - 02_taxa_worms.qmd
    - 03_publish_to-obis.qmd
    - 04_archive_to-ncei.qmd
    - map_project-4.qmd

website:
  title: "EcoTaxa demo: pipelines to OBIS and NCEI"
  description: "R Quarto notebooks that take an EcoTaxa project to a Darwin Core Archive for OBIS and an archive package for NCEI"
  navbar:
    left:
      - href: index.qmd
        text: Overview
      - href: 01_export_ecotaxa.qmd
        text: "01 Export"
      - href: 02_taxa_worms.qmd
        text: "02 Taxa"
      - href: 03_publish_to-obis.qmd
        text: "03 OBIS"
      - href: 04_archive_to-ncei.qmd
        text: "04 NCEI"
      - href: map_project-4.qmd
        text: "Sample map"
    right:
      - href: https://ecotaxa.oceanmetrics.io/prj/2
        text: Demo node
      - href: https://github.com/oceanmetrics/ecotaxa-demo
        icon: github

format:
  html:
    theme: cosmo
    toc: true
    code-fold: show
    code-tools: true
    df-print: kable
    # diagrams: mermaid's own default theme (not the colours quarto derives from the
    # bootstrap theme, which filled every subgraph dark grey), the look of the CalCOFI.io
    # docs book (Source Sans 3, SVG labels, curved edges) and a pan-zoom viewer with a
    # full-screen button, both from calcofi4r 1.31.0's cc_diagram_viewer() (libs/)
    mermaid:
      theme: default
    css: libs/diagram.css
    include-after-body:
      text: |
        <script src="libs/svg-pan-zoom.min.js"></script>
        <script src="libs/diagram.js"></script>

execute:
  warning: false
  message: false
